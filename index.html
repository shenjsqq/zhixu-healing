<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>知绪 · 碎片化解压治愈轻服务站</title><style>:root{--bg-cream:#FFF7F5;--card-white:#FFF;--pink-primary:#FF8E9E;--pink-soft:#FFE6E9;--text-main:#4A3E3D;--text-sub:#8E7C7A;--border-card:#FBECE8}*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif}body{background:#F5EFEB;display:flex;justify-content:center;min-height:100vh;color:var(--text-main)}.phone{width:100%;max-width:440px;background:var(--bg-cream);min-height:100vh;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,0.06)}.banner{background:#FFF;border-radius:20px;padding:18px;border:1.5px solid var(--border-card);margin-bottom:14px;box-shadow:0 4px 14px rgba(74,62,61,0.05)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.card{background:#FFF;padding:14px;border-radius:16px;border:1.5px solid var(--border-card)}.btn{background:var(--pink-soft);color:var(--pink-primary);border:none;border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer}</style></head><body><div class="phone"><div class="banner"><h2>知绪小角落 🌸</h2><p style="font-size:12px;color:var(--text-sub);margin:8px 0;">给压力留一个3分钟的小角落，随时深呼吸～</p><button class="btn">✨ 已开启治愈模式</button></div><div class="grid"><div class="card"><h4>番茄专注</h4><p style="font-size:11px;color:#888;">雨声与白噪音</p></div><div class="card"><h4>情绪信箱</h4><p style="font-size:11px;color:#888;">匿名悄悄话</p></div><div class="card"><h4>治愈素材</h4><p style="font-size:11px;color:#888;">原创壁纸手账</p></div><div class="card"><h4>解压好物</h4><p style="font-size:11px;color:#888;">校园自提轻玩具</p></div></div><div class="card" style="text-align:center;font-size:11px;color:#B8A9A7;">知绪 · 校园轻量陪伴工具站</div></div></body></html>
